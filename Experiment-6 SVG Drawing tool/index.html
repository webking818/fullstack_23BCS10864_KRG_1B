<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Drawing Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f9fa;
    }

    #toolbar {
      margin: 15px;
    }

    #drawingArea {
      border: 2px solid #333;
      background-color: white;
      cursor: crosshair;
    }

    button {
      padding: 6px 12px;
      margin: 5px;
      border-radius: 6px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    input[type="color"] {
      border: none;
      width: 40px;
      height: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🎨 SVG Drawing Tool</h2>

  <div id="toolbar">
    <label>Pick Color: </label>
    <input type="color" id="colorPicker" value="#ff0000">
    <button id="undoBtn">Undo</button>
  </div>

  <!-- SVG Drawing Area -->
  <svg id="drawingArea" width="600" height="400"></svg>

  <script>
    // Get references to elements
    const svg = document.getElementById('drawingArea');
    const colorPicker = document.getElementById('colorPicker');
    const undoBtn = document.getElementById('undoBtn');

    let isDrawing = false;
    let drawnShapes = [];

    // Mouse down: start drawing
    svg.addEventListener('mousedown', (e) => {
      isDrawing = true;
      drawCircle(e);
    });

    // Mouse move: draw as you move
    svg.addEventListener('mousemove', (e) => {
      if (isDrawing) drawCircle(e);
    });

    // Mouse up: stop drawing
    svg.addEventListener('mouseup', () => {
      isDrawing = false;
    });

    // Function to draw a circle using createElementNS
    function drawCircle(e) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', e.offsetX);
      circle.setAttribute('cy', e.offsetY);
      circle.setAttribute('r', 8);
      circle.setAttribute('fill', colorPicker.value);
      svg.appendChild(circle);
      drawnShapes.push(circle);
    }

    // Undo the last drawn shape
    undoBtn.addEventListener('click', () => {
      const lastShape = drawnShapes.pop();
      if (lastShape) {
        svg.removeChild(lastShape);
      }
    });
  </script>
</body>
</html>
